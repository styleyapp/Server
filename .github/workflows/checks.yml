name: Server checks
on:
  pull_request:
  push:
    branches: [development, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: styley_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install '.[dev]'
      - run: ruff format --check app tests scripts
      - run: ruff check app tests scripts
      - run: python -m pytest -q
      - name: Database migration and role tests
        env:
          PGPASSWORD: test
        run: python scripts/check_database.py --url postgresql://postgres@localhost:5432/styley_test
