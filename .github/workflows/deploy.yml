name: Deploy Styley Server

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: styley-server-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and check the Server
        run: |
          python -m pip install --disable-pip-version-check -e . pytest==9.1.1 ruff==0.16.9
          ruff check app tests scripts
          pytest -q

      - uses: google-github-actions/auth@v3
        with:
          project_id: project-9c6ace89-27fc-4cd0-85d
          workload_identity_provider: projects/448199079489/locations/global/workloadIdentityPools/styley-github/providers/server-main
          service_account: styley-github-deploy@project-9c6ace89-27fc-4cd0-85d.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy styley-server \
            --project=project-9c6ace89-27fc-4cd0-85d \
            --region=me-west1 \
            --source=. \
            --build-service-account=projects/project-9c6ace89-27fc-4cd0-85d/serviceAccounts/styley-server-build@project-9c6ace89-27fc-4cd0-85d.iam.gserviceaccount.com \
            --quiet

      - name: Check live health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://styley-server-448199079489.me-west1.run.app/health
