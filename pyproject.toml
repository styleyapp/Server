[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "styley-server"
version = "0.1.0"
description = "Styley's independently deployable backend."
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
