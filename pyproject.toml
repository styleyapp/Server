[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "styley-server"
version = "0.1.0"
description = "Styley's independently deployable backend."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "google-auth[requests]==2.59.0",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "pillow-heif==1.8.0",
  "python-dotenv==1.2.3",
  "python-multipart==0.0.32",
  "uvicorn==0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
